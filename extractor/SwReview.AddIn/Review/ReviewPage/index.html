<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>SwReview</title>
<!--
  tokens.css first and app.css second, always: the shared file declares the one palette and
  type scale every tab in the pane draws from (web/shared/tokens.css) and this page's own
  stylesheet names no colour of its own, only those custom properties. Linked in the other
  order the page would win its own tokens back and the four tabs would drift apart again.
-->
<link rel="stylesheet" href="../../shared/tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="view-results">
<!--
  The Review tab. Served by the host itself on https://swreview.invalid, so the CSP above is
  what the page actually runs under: no inline script, no inline style, no remote anything,
  and connections to this page's own origin only - the backend is reached under `/__backend`,
  where the host answers and calls it from C# (docs/pane-backend-proxy.md).

  Every handler is attached in app.js with
  addEventListener - there is no event-handler attribute anywhere in this file - and app.js
  builds every node with textContent rather than by assigning markup, because assistant text,
  finding titles and drawing text are authored by a model or by a reviewed document
  (FR-029, contracts/pane-host-messages.md).

  The chat transcript is built by render.js, which is loaded first so app.js can render
  through it; render.js holds every card the transcript shows and touches nothing else, which
  is what lets the injection test (T042a) render a hostile finding inside this page.

  shared/dom.js comes before both. It holds the element and formatting helpers every node on
  this page is built with, and the Model check page loads the same file from the same virtual
  host (T080): they are the single place the "insert every untrusted string with
  createTextNode" rule is written down, so they are shared rather than copied.
-->
<header class="bar">
  <span id="document-name" class="document">No document open</span>
  <span id="backend-state" class="badge">Backend starting</span>
  <button type="button" id="toggle-settings" class="link">Settings</button>
</header>

<p id="banner" class="banner" hidden></p>

<section id="settings" class="panel" aria-labelledby="settings-heading" hidden>
  <h2 id="settings-heading">Settings</h2>

  <div class="field">
    <label for="provider">Provider</label>
    <select id="provider"></select>
  </div>

  <div class="field">
    <label for="model">Model</label>
    <span class="row">
      <select id="model"></select>
      <button type="button" id="refresh-models">Refresh</button>
    </span>
    <span id="model-note" class="note"></span>
  </div>

  <div class="field">
    <label for="effort">Reasoning effort</label>
    <select id="effort">
      <option value="low">low</option>
      <option value="medium">medium</option>
      <option value="high">high</option>
      <option value="xhigh">xhigh</option>
    </select>
  </div>

  <div class="field">
    <label for="api-key">API key</label>
    <input type="password" id="api-key" autocomplete="off" spellcheck="false">
    <span id="key-source" class="note"></span>
    <label class="check"><input type="checkbox" id="clear-key"> Remove the stored key</label>
  </div>

  <!-- OPENAI_BASE_URL is the only endpoint override the backend reads, so this row is
       hidden for any other provider rather than accepting one the host would refuse. -->
  <div class="field" id="base-url-field">
    <label for="base-url">Base URL (enterprise gateway, optional)</label>
    <input type="text" id="base-url" autocomplete="off" spellcheck="false">
  </div>

  <fieldset id="enterprise" class="field">
    <legend>Gemini Enterprise (optional)</legend>
    <label for="gcp-project">Project</label>
    <input type="text" id="gcp-project" autocomplete="off" spellcheck="false">
    <label for="gcp-location">Location</label>
    <input type="text" id="gcp-location" autocomplete="off" spellcheck="false">
  </fieldset>

  <div class="actions">
    <button type="button" id="save-settings">Save</button>
    <span id="save-state" class="note" role="status"></span>
  </div>
</section>

<!--
  Results or Transcript (feature 009 User Story 5, contracts/views.md section 1): two buttons, and
  whichever is pressed owns the pane - a class on the body, `view-results` on every load. Results
  answers "what is wrong"; Transcript answers "how the reviewer got there". Neither label carries a
  count: the counts are the Transcript's own business.
-->
<nav id="view-switch" class="view-switch" aria-label="Review view">
  <button type="button" id="view-results" aria-pressed="true">Results</button>
  <button type="button" id="view-transcript" aria-pressed="false">Transcript</button>
</nav>

<section id="session" class="session">
  <div class="row">
    <button type="button" id="start-review" class="primary" disabled>Review</button>
    <button type="button" id="stop-turn" disabled>Stop</button>
    <button type="button" id="clear-review" disabled>Clear review</button>
    <button type="button" id="open-report" disabled>Open report</button>
    <button type="button" id="open-folder" disabled>Open run folder</button>
    <button type="button" id="open-log">View log</button>
  </div>
</section>

<!--
  The one line a review leaves when the document on screen is not the one it is of (U8):
  whose review it is, and what to press instead. app.js hides the results themselves with one
  class on the body and writes this line; it is hidden while the two documents agree.
-->
<p id="stale-review" class="stale-review" role="status" hidden></p>

<section id="review-preparation" class="panel" aria-labelledby="preparation-heading" hidden>
  <h2 id="preparation-heading">Before this review</h2>
  <p id="preparation-summary"></p>
  <ul id="preparation-instances"></ul>
  <p class="note">Resolve the components you need in SOLIDWORKS, then check again. Continuing reviews the available evidence and records what could not be examined.</p>
  <div class="row">
    <button type="button" id="preparation-check">Check again</button>
    <button type="button" id="preparation-continue">Review available evidence</button>
    <button type="button" id="preparation-cancel">Cancel</button>
  </div>
</section>

<!--
  Results: what is wrong, in the order an engineer reads it - one line of where the review stands,
  the summary, the questions, the parts not loaded, Start here, the findings (with the
  modelling-practice group and the contacts after them), what was not reached, the error cards in
  plain words, and the follow-up answers pinned under their questions. No tool call, no argument,
  no token count (FR-018). It scrolls as one, and nothing arriving on the stream ever moves it.
-->
<section id="results" class="view results" aria-label="Results">

<p id="results-state" class="results-state" role="status" hidden></p>

<!--
  The review in ten seconds (feature 009 User Story 3): the headline, Decide / Fix / Verify, the
  questions, the parts not loaded and one line per check goal. The backend computes every number
  and word of it and sends it beside the ranking (`summary` on GET /sessions/{chat_id}/attention);
  app.js prints it here, above everything else the review shows, and computes nothing
  (contracts/review-summary.md section 5). Hidden until a summary arrives, so a backend that sends
  none leaves the page exactly as it was (FR-030).
-->
<section id="summary" class="panel summary-panel" aria-label="Review summary" hidden></section>

<!--
  Questions for you (feature 009 User Story 4): what the review cannot see and only the engineer
  knows, asked one short question at a time, answered together in one submission that resumes the
  review once - with the cost of resuming stated beside Send. The open questions are the summary's
  (`summary.questions`, in its order); the page keeps only the drafts (contracts/questions.md
  section 4). Hidden while there is no open question.
-->
<section id="questions" class="panel questions-panel" aria-label="Questions for you" hidden></section>

<!-- The extractor's coverage warning is a separate, wrapping surface so a long sentence is
     readable in the narrow pane instead of being squeezed into the header status badge. A div
     rather than a paragraph since feature 009: with the backend's names-only headline it holds
     a fold of the instances' ids beneath the headline, and a fold is not phrasing content. -->
<div id="not-examined" class="not-examined" hidden></div>

<!--
  What to start with: the rows the backend ranked, read from `GET /sessions/{chat_id}/attention`
  when the session ends and shown above the findings, because a panel under a list that has just
  grown by a whole review is a panel nobody scrolls to (contracts/attention.md section 6). Hidden
  until there is something to show.
-->
<section id="attention-panel" class="panel" hidden></section>

<!--
  The findings, one headline card each, in the order they arrived; a re-run replaces its card in
  place. Collapse all sits over them (U10): it shuts every finding's own fold, so the list goes
  back to one headline per finding however many of them an engineer opened.
-->
<div id="findings-head" class="findings-head" hidden>
  <h3 class="eyebrow">Findings</h3>
  <button type="button" id="collapse-findings" class="link">Collapse all</button>
</div>
<div id="findings" class="findings"></div>

<!--
  The size-for-size contacts (feature 009 FR-011, the owner's decision of 2026-09-23): one shut
  list after the findings and apart from them, printed from the summary's `contacts`. A contact is
  not a finding, so it is never in a finding card, in Start here or in the modelling-practice
  group. Hidden while there are none.
-->
<section id="contacts" class="panel" aria-label="Size-for-size contacts" hidden></section>

<section id="coverage-panel" class="panel" hidden></section>

<!-- What stopped, in plain words, with what to do next. The class is the Transcript's. -->
<div id="errors" class="errors"></div>

<!-- Follow-up answers, pinned under their questions, so nobody has to switch to read one (FR-019). -->
<div id="answers" class="answers"></div>

</section>

<!--
  Transcript: how the reviewer got there, in the order it happened - the reviewer's prose and the
  engineer's, every tool call with its detail, the evidence records, a one-line marker where each
  finding was recorded, and error lines that name their class. Its head counts the calls and the
  rounds and names the running tool, and carries the run folder, the stream state and the usage
  line (feature 005 T016a) - the developer vocabulary lives here, out of Results. Only this view
  scrolls itself as it grows.
-->
<section id="transcript-view" class="view transcript-view" aria-label="Transcript">
  <div id="transcript-head" class="transcript-head">
    <div class="transcript-title">
      <span class="eyebrow">Transcript</span>
      <span id="transcript-counts" class="fold-count"></span>
    </div>
    <div class="meta">
      <span id="run-dir" class="mono"></span>
      <span id="stream-state" role="status"></span>
      <span id="usage-line" role="status"></span>
    </div>
  </div>
  <main id="transcript" class="transcript" aria-live="polite"></main>
</section>

<!--
  A form so Enter sends the follow-up. It never submits: the handler cancels it, and the CSP's
  `form-action 'none'` is the backstop if a handler is ever lost.
-->
<form id="followup" class="followup">
  <label for="followup-text" class="visually-hidden">Follow-up question</label>
  <input type="text" id="followup-text" autocomplete="off"
         placeholder="Ask a follow-up about any finding" disabled>
  <button type="submit" id="followup-send" class="primary" disabled>Send</button>
</form>

<script src="../../shared/dom.js"></script>
<script src="../../shared/document.js"></script>
<script src="../../shared/attention.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
