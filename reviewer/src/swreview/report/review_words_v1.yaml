# Every word the backend supplies to the Review tab, once (feature 009, research R2.5).
#
# The page prints these and words nothing itself, so a later wording change is a change to
# this file and to no code. `report/summary.py` loads it through `load_words()`; every key
# is named by a model there, and a key it does not name is refused.
#
# Two rules for every string below:
# - no percent sign: the ranking and these words reach the Standards tab, whose body scan
#   forbids one (write "30 percent");
# - a placeholder in braces is filled by `report/summary.py` or `report/finding_groups.py`
#   and nowhere else; the ones each template may carry are pinned in
#   `tests/unit/test_review_words.py`.
version: review_words_v1

headline:
  none: "No findings were recorded"
  findings_one: "1 finding"
  findings_many: "{n} findings"
  issues_one: "in 1 issue"
  issues_many: "in {n} issues"
  checked: "{n} checked, no issue"

# What joins two parts of one line: the headline's issues and passes, the tally's entries,
# a row's fold count and tail, and a group's count and decided count (feature 013).
separator: " · "

# The three owner groups first (the owner's labels, 2026-09-23), then the two shown only
# when they hold a finding. `one` is used at exactly 1 and `many` otherwise, 0 included.
groups:
  decide:
    label: "Decide"
    one: "{n} needs your decision"
    many: "{n} need your decision"
  fix:
    label: "Fix"
    one: "{n} to fix"
    many: "{n} to fix"
  verify:
    label: "Verify"
    one: "{n} to verify"
    many: "{n} to verify"
  decided:
    label: "Decided"
    one: "{n} decided"
    many: "{n} decided"
  within_scope:
    label: "Checked, no issue"
    one: "{n} checked, no issue"
    many: "{n} checked, no issue"

# The summary's one tally line (feature 013): each owner group's label and count, then
# Decided when it holds a finding, joined by `separator` - "Decide 2 · Fix 5 · Verify 1".
tally:
  item: "{label} {n}"

# How the triage stands (owner decisions 185A and 187A; feature 002 FR-031, cycle 7): report.md's
# two lines, which the Review tab prints as sent under the summary. `item` is one outcome, in
# `labels.triage`'s word, and the four are joined by ", " into `by_triage`'s {counts}; `not
# recorded` counts the flagged findings with none, and `misses` the passes judged wrong.
triage_tally:
  by_triage: "By triage: {counts}, not recorded: {not_recorded}"
  item: "{triage}: {n}"
  misses: "Passes judged wrong (misses): {n}"

# The goals not reached, named in goal order as a sentence names them (feature 013): the goal
# lines live under their groups, so this line keeps the coverage gaps on the first screen.
not_reached: "Not reached: {titles}"

questions:
  one: "1 question for you"
  many: "{n} questions for you"
  # The text box a question that allows typed words draws beside its buttons (feature 013).
  text_placeholder: "Or name the bought ones, separated by commas"

not_loaded:
  text: "{count} of {total} parts not loaded"

# The report's section naming the bought parts not graded (feature 013); its sentences are the
# pre-run rows' own, which reach the model and so live beside the classifier, not here.
bought_parts:
  heading: "Bought parts"

# One line naming the drawings the review read and the same-name drawings it found beside a
# reviewed file but did not open (owner, 2026-09-23, decision 10A). `{names}` is the file names
# joined as a sentence joins them; past ten names, `more` names the first ten and counts the
# rest. The two parts are joined with ". ", and a part with no name is left out.
drawings:
  read_one: "Drawing read: {names}"
  read_many: "Drawings read: {names}"
  candidates_one: "Same-name drawing found but not open: {names}"
  candidates_many: "Same-name drawings found but not open: {names}"
  more: "{names} and {n} more"
  # While the seat cannot open a closed drawing (feature 013): `{model}` is the reviewed
  # document's file name, active when Review is pressed again, since Review refuses a drawing.
  open_then_review_one: "Open {names} in SOLIDWORKS, then press Review again with {model} active"
  open_then_review_many: "Open {names} in SOLIDWORKS, then press Review again with {model} active"

contacts:
  one: "1 size-for-size contact"
  many: "{n} size-for-size contacts"

resume:
  with_tokens: "Sending resumes the review once. Its last round sent {tokens} input tokens."
  without: "Sending resumes the review once."

# Feature 015: the waiting review and its Send block.
send:
  first_request: "Send starts the model's review. Its first request is {tokens} input tokens; the requests after it are not counted in advance."
  first_request_approximate: "Send starts the model's review. Its first request is about {tokens} input tokens (approximate: Gemini counts tokens its own way); the requests after it are not counted in advance."
  without: "Send starts the model's review."
  restored: "Send checks the saved evidence again, then starts the model's review."
  failed: "The model did not answer: {reason} ({time}). Nothing else changed; Send to model is offered again."
  not_started: "Send to model could not start: {reason} ({time}). Nothing was sent; Send to model is offered again."
  apply_answers: "Applying your answers regrades the review by code. Nothing is sent to the model."
  restored_line: "Its checks ran {when}; Send checks the saved evidence again first."
  rerun_failed: "The saved evidence could not be checked again, so nothing changed and nothing was sent. The next Send tries again."

# The first line of every model answer, computed from the answer turn's steps and never from
# the model's text (feature 013): how many results it read, and - when the review read no
# drawing - that no drawing was read, appended after `none`, `one` or `many`.
answer_basis:
  none: "No evidence was read for this answer: this is general guidance."
  one: "Based on 1 result read for this answer."
  many: "Based on {n} results read for this answer."
  no_drawing: " No drawing was read in this review."

# The line a finding's card shows when a check the model ran again after the engineer's answer
# changed its verdict - its status or its severity - and so cleared the decision and its triage
# (feature 002 FR-031, owner decisions 189A and 191A). `{decision}` is the decision's noun
# ("Accept", "Reject", "Defer") and `{triage}` the triage's word in `labels.triage`;
# `cleared_with_triage` is the line for a disposition that holds a triage. The backend fills
# both and the page prints the line as sent. Owner decision 194A: `restated` when the answer
# graded the checks again by code (58A's restate), and `carried` when a re-run of a waiting
# review did not carry the decision (feature 015's carry), each with its `_with_triage`.
# `decide_again` ends each line, after a space, on a review that takes decisions; a read-only
# restore's buttons are off, so the line it shows leaves it out (feature 002 cycle 13).
rerun:
  cleared: "The check ran again after your answer and its verdict changed, so your {decision} was cleared."
  cleared_with_triage: "The check ran again after your answer and its verdict changed, so your {decision} ({triage}) was cleared."
  restated: "Your answer graded the checks again and this verdict changed, so your {decision} was cleared."
  restated_with_triage: "Your answer graded the checks again and this verdict changed, so your {decision} ({triage}) was cleared."
  carried: "The checks ran again on the saved evidence and this verdict changed, so your {decision} was not carried over."
  carried_with_triage: "The checks ran again on the saved evidence and this verdict changed, so your {decision} ({triage}) was not carried over."
  decide_again: "Decide again."

# What a withdrawal took (feature 002 FR-031, roadmap hole H-g-010): when an answer graded the
# checks again and a check no longer produces a finding that held a decision, the decision and its
# triage go with the finding, and the Transcript's line saying it was withdrawn ends with this
# clause, after its reason. `{decision}` and `{triage}` are filled as in `rerun`, a pass's miss as
# its card words it; `took_with_triage` is for a disposition that holds a triage. The backend fills
# it and sends it in `finding.withdrawn` as `taken`; the page prints it as sent, and `report.md`
# names the finding among those withdrawn with a decision in the same line.
withdrawn:
  took: "your {decision} went with it"
  took_with_triage: "your {decision} ({triage}) went with it"
  # Ends `report.md`'s line for each withdrawal a re-run (Check again, feature 015) names from an
  # earlier record, whose id is that record's and may name another finding of the re-run's.
  # `{session_id}` is the session that withdrew it, in full, as that record's report heads itself.
  earlier: " (earlier check run, session {session_id})"

read_only_lead: "The backend restarted, so this review is shown from its run folder."
read_only_off: "Follow-ups, decisions and answers are off."
# Ends the line of a record restored from its run folder that waits for no Send, after a space,
# while a flagged finding - every status but a pass - records no outcome: its decision buttons are
# off, and the console still records one (feature 002 FR-031, cycle 22; roadmap hole H-c-011). A
# record waiting for Send never names it, since its Send leads back to a review that takes them.
read_only_console: "Record the rest of the triage at the console: swreview disposition."

goal_states:
  issues: "issues found"
  checked: "checked, no issue"
  not_reached: "not reached"
  not_applicable: "not applicable"

# The short reason a goal line carries; the recorded sentence behind it goes to the fold.
goal_reasons:
  unresolved: "evidence missing"
  skipped: "skipped"
  failed: "a check failed"
  out_of_scope: "out of scope"
  no_check: "no check ran"

# The check goals, in the owner's order (contracts/review-summary.md section 3). `items` are
# exact coverage check ids - checklist items, and the pre-run rows of feature 008 - and
# `prefixes` are the check ids the goal owns. A check belongs to the goal whose `items` name
# it, else to the goal with the longest prefix it starts with: `fastener.head_fit` is tool
# access, not fasteners; `standards.drawing.*` and `rms.drawing.*` are drawings. Modelling
# practice is a goal of its own (2026-09-23), so modelling findings never fill the hygiene
# line, and so is Standards (feature 013, its research R2.14). `group` is the
# `finding_groups` id a goal's findings are listed under - one taxonomy for goals and groups:
# folding Mass and material into Hygiene is that goal's `group: hygiene` and no other edit.
# A goal's `items` may also name a finding id it owns without its prefix: no coverage row
# carries one, so it is never a close-out row.
goals:
  - id: interference
    title: "Interference"
    items: [interference, coverage.prerun.interference]
    prefixes: [interference.]
    group: interference_fit
  - id: fasteners
    title: "Fasteners"
    # The two thread pitch finding ids by name (feature 010 amendment 2026-10-08, the owner's
    # decision 63A), never the prefix `thread.`: the coverage-only `thread.pitch` rows then
    # belong to no goal, so no goal line moves.
    items: [fasteners, thread.fine_pitch, thread.nonstandard_pitch]
    prefixes: [fastener.]
    group: fasteners
  - id: hole_alignment
    title: "Hole alignment"
    items: [holes.alignment]
    # `joint.` is feature 010's joint map (coverage rows only): the joints alignment is
    # judged on, the near misses listed for the engineer, and the holes it could not use.
    prefixes: [hole., joint.]
    group: interference_fit
  - id: fits_and_stacks
    title: "Fits and stacks"
    items: [interfaces.fit, interfaces.stack]
    prefixes: [fit., stack.]
    group: interference_fit
  - id: tool_access
    title: "Tool access"
    items: []
    prefixes: [fastener.head_clearance, fastener.head_fit]
    group: fasteners
  - id: mass_and_material
    title: "Mass and material"
    items: [mass.material]
    prefixes: [mass., standards.part.material_assigned]
    group: mass_material
  - id: hygiene
    title: "Hygiene"
    items: [provenance, hygiene]
    prefixes: [provenance., hygiene.]
    group: hygiene
  - id: standards
    title: "Standards"
    items: [standards.release, coverage.prerun.standards]
    prefixes: [standards.]
    group: standards
  - id: drawings
    title: "Drawings"
    items: [drawing.manufacturing_inputs]
    # `drawing_profile.` is feature 011's drawing standard comparison: a drawings finding,
    # named so it cannot close the checklist item `drawing.manufacturing_inputs`.
    prefixes: [drawing., drawing_profile., standards.drawing., rms.drawing.]
    group: drawings
  - id: modelling_practice
    title: "Modelling practice"
    items: [modeling.resilience]
    prefixes: [rms.]
    group: modelling_practice

# The groups the findings are listed under, in their fixed order (feature 013, its
# `contracts/grouped-list.md` section 2): each row of a review sits in the group of its goal,
# a check no goal names in "Other checks" (last, and only when it holds a row), and every pass
# in the one "Checked, no issue" fold. `open` is how a group arrives on the Review tab. A group
# with no goal and no row is left out.
finding_groups:
  - {id: interference_fit, title: "Interference and fit", open: true}
  - {id: fasteners, title: "Fasteners", open: true}
  - {id: drawings, title: "Drawings", open: true}
  - {id: standards, title: "Standards", open: true}
  - {id: modelling_practice, title: "Modelling practice", open: false}
  - {id: hygiene, title: "Hygiene", open: true}
  - {id: mass_material, title: "Mass and material", open: true}
finding_group_other: {id: other, title: "Other checks", open: true}
finding_group_checked:
  title: "Checked, no issue"
  open: false
  exception_tail: "within an accepted exception"

# A group's count line, and a row's fold count and reach: the page prints them and counts
# nothing. `decided` follows the count after `separator`; a row's `fold_tail`, reach and tail
# are joined by it too.
finding_group_text:
  one: "1 finding"
  many: "{n} findings"
  decided: "{d} decided"
  fold_tail: "×{n}"
  reach_one: "reaches 1 component"
  reach_many: "reaches {n} components"

# The card vocabulary `GET /labels` serves (data-model section 7). `errors` holds one
# sentence per error class saying what to do next: every backend `ChatError` class, every
# class the Review host and `PaneActions` send, each pane host's unknown-run class, and the
# classes the Review page makes itself. `errors` stays the last block, one class per line:
# `ErrorLabelsCoverTheHostTests` reads it by indentation.
labels:
  version: review_words_v1
  status:
    demonstrated: "demonstrated"
    suspected: "suspected"
    unresolved: "unresolved"
    checked_within_scope: "checked within scope"
  severity:
    high: "high"
    medium: "medium"
    low: "low"
    info: "info"
  bucket:
    checked: "checked"
    skipped: "skipped"
    unresolved: "unresolved"
    failed: "failed"
    out_of_scope: "out of scope"
  evidence_status:
    open: "open"
    answered: "answered"
  contact_kind:
    zero_volume: "touching"
    possible_only: "possible only"
    thread_model: "thread model"
  # A finding's triage beside its decision (owner decision 185A, feature 002 FR-031): one word
  # per outcome, keyed by the tokens of `findings.TRIAGES` in their order; the page prints the
  # word for a disposition's `triage` and compares nothing, and `report.md` uses the same four.
  triage:
    new_and_real: "new and real"
    already_known: "real but already known"
    wrong: "wrong"
    not_worth_flagging: "true but not worth flagging"
  # The one triage a pass takes (owner decision 187A, feature 002 FR-031): a pass - 'Checked, no
  # issue' - takes no triage but `wrong`, keyed by `findings.MISS`, and its card's one button says
  # it is the miss it is counted as, apart from the false alarms; `source` stays just before
  # `errors`.
  pass_triage:
    wrong: "wrong: a miss"
  # What a flagged finding's card head says until its triage is recorded (roadmap hole H-c-008,
  # feature 002 FR-031): one sentence for each state of its record. A decision recorded without a
  # triage names the repair, the same decision pressed again with an outcome picked - for a Defer,
  # Defer again, which records the outcome and keeps the deferral (owner decision 198A); a finding
  # not yet decided (`undecided`) only says none is recorded.
  # `read_only` is what such a card says while its review is read-only, whatever its decision: its
  # buttons are off, so it too only says none is recorded, and names no press. The page prints the
  # sentence for the recorded decision, or `read_only`'s, and compares nothing, and none on a pass,
  # which takes no triage but the miss.
  no_triage:
    undecided: "No triage recorded yet"
    accepted: "No triage recorded yet: pick one, then press Accept again"
    rejected: "No triage recorded yet: pick one, then press Reject again"
    deferred: "No triage recorded yet: pick one, then press Defer again"
    read_only: "No triage recorded yet"
  # What a card says when a late triage keeps the note recorded first (owner decision 198A, feature
  # 002 FR-031; cycle 11's Tier 2 review): a different note sent with it is not kept, so the page,
  # comparing the note its press sent, when not blank, with the reply's, both trimmed, prints this
  # under the reply's sentence until the card's status is next written; with no labels, nothing.
  note:
    not_kept: "The note recorded first stays."
  # When an earlier review of the same document first showed a flagged finding (roadmap hole
  # H-a-009, feature 002 FR-031, cycle 17), so owner decision 188A's date is read, not recalled:
  # `{date}` is the earliest such review's date, YYYY-MM-DD. The card prints it under the title, the
  # date as text, and `report.md` as the first line under the finding's heading; with no labels, or
  # a body without the date, the card prints nothing.
  first_shown:
    earlier: "First shown in the review of {date}."
  # The minutes form on the Review page (feature 007, cycle 18): the word for each human timing
  # input, keyed by `benchmark.timing.TIMING_INPUTS` in their order. The page draws one field per
  # key, in this order, labelled with its word, and posts each under its key to
  # `POST /sessions/{chat_id}/timing`; with no labels, or neither group, it draws no form (009
  # FR-030). Each word names its input as the seat plan's step 4.1 does, then what its minutes
  # count (owner decisions 183A and 184A).
  timing:
    baseline: "Baseline: a review of this design by hand, without SwReview"
    supervision: "Supervision: your time on the review while it ran"
    verification: "Verification: checking the findings judged right"
    false_alarms: "False alarms: the findings judged wrong"
    setup: "Setup: preparing and starting this review, any rerun included"
    by_hand: "By hand: checking what the review did not reach"
  # The minutes form's heading, its button and the one line a save leaves. No word here names a
  # figure: the figures stay in the fields (decision 186A), and a refused save says its class's
  # sentence from `errors`. `all_six` (cycle 20, roadmap hole H-a-015) is the line under the
  # heading: Save stays off while any field is blank, so each save records all six. It says zero
  # in a word, since no word here holds a digit. Since cycle 20's Tier 2 review it says to type
  # them once known, and that each replaces what is recorded: the form is blank over minutes
  # already recorded, and a 0 typed there replaced one.
  timing_form:
    heading: "Minutes for this review"
    all_six: "Type all six once you know them, zero for none. Each replaces what is recorded."
    save: "Save minutes"
    saved: "The minutes are recorded."
  # Who wrote a finding, a question or a coverage row (feature 013): the page prints the word
  # for a record's `source` token and compares nothing; `report.md` uses the same two.
  source:
    code: "Checked by code"
    model: "AI guidance"
  errors:
    AlreadyAccepted: "That condition already has an active exception, so nothing new was recorded."
    AlreadyAnswered: "That question was already answered, perhaps in another window. Reload the review to see its answer."
    BackendNotRestarted: "The settings are saved, but the review backend did not restart with them. Save Settings again to retry the restart."
    AddInStopping: "The settings are saved. The add-in is stopping; nothing else needs doing."
    BackendUnavailable: "The review backend is not running or not answering. Save Settings to start it again, then retry."
    BridgeOnAnotherDocument: "The SOLIDWORKS bridge is not attached to this review's document yet, so the review did not start. It follows the active document once no review turn or remodel holds it. Wait a moment, then try again."
    BridgeUnavailable: "SOLIDWORKS could not be reached. Check that the add-in is loaded, then try again."
    CheckRunning: "A Model check or Standards check is in progress. Wait for it to finish, then try again."
    ContextExpired: "The document or saved evidence changed. Extract context evidence again."
    ContextPreparationFailed: "Evidence could not be extracted. Check that the part or assembly is saved and loaded, then extract context evidence again."
    DocumentChanged: "The active document or its configuration changed while the review was starting, so the review did not start. Make the part or assembly and the configuration you want reviewed active, then press Review again."
    DocumentDirty: "Save the part first. Remodel never saves the open document for you."
    DrawingActive: "Keep the drawing open in SOLIDWORKS and activate the part or assembly it documents. Press Review with that model active; Review reads open drawings whose views show the model."
    EmptyNote: "Say why the condition is accepted. An exception needs a reason."
    EngineeringContextConflict: "Wait for any review of this model to finish, then refresh the saved inputs in the Engineering context panel. If a review's saved context changed, extract context evidence again there and review with it."
    EngineeringContextRefused: "Refresh saved inputs and check the target and values before trying again."
    ExternalReferences: "This part references other files. Remodel works only on a part with no external references."
    ExtractionFailed: "The model could not be read. Check that it rebuilds and is fully loaded, then press Review again."
    FakeProviderNotAllowed: "The test provider is off in this build. Choose another provider in Settings."
    ForbiddenOrigin: "The review backend refused a page it does not know. Close and reopen the task pane."
    HostError: "The add-in hit a problem it did not expect. Try again; if it keeps happening, open the log."
    HttpError: "The review backend answered with an error. Try again; if it keeps happening, open the log."
    IllegalTransition: "That decision cannot follow the one already recorded. Reload the review to see its state."
    InvalidContext: "Refresh saved inputs before starting the review with context."
    InvalidDecision: "Choose accept, reject or defer."
    InvalidPackage: "The model dump could not be read. Press Review again to dump the model afresh."
    InvalidRequest: "The request was not understood. Reload the task pane and try again."
    InvalidRunDir: "The backend refused the run folder's path: it writes only into a local folder inside the run root. Check the run root in Settings."
    InvalidSettings: "Check the provider, the model and the effort, then save again."
    InvalidTiming: "Enter each as a number of minutes, 0 or more, then save again."
    InvalidTriage: "Pick one of the four triage outcomes, or none, then press the decision again. A finding in Checked, no issue takes only wrong: a miss."
    NoDocument: "Open the part or assembly you want reviewed, then press Review."
    NotAPart: "Remodel works on one part. Open a part, then try again."
    NotAttached: "The add-in is not attached to SOLIDWORKS yet. Wait a moment, then try again."
    NotFound: "That file or folder no longer exists. It may have been moved or deleted."
    NotModelCheck: "The run folder does not hold a model check of one part. Run the Model check again."
    OpenFailed: "The file could not be opened. Check that it still exists and that you can open it."
    OutcomeNeeded: "Pick an outcome first, then press the same button again."
    PackageAfterRefused: "The remodelled part could not be read back. Open the run folder to see what was written."
    PackageMissing: "The model dump has not arrived yet. Wait for it, then try again."
    PathRefused: "That path is outside the folders this pane may open."
    PreparationExpired: "The preparation is out of date. Press Review again."
    PreparationFailed: "The review could not be prepared. Check that the model is open and saved, then press Review again."
    RemodelRunning: "A remodel run is in progress. Wait for it to finish, then try again."
    ReportMissing: "The report has not been written yet. Wait for the review to finish."
    ResumeRefused: "This run folder already holds a change log. Start a new remodel instead."
    RuleNotAcceptable: "Only a failing rule can take an exception. Fix this one in the model instead."
    RunDirInUse: "Another review is using this run folder. Wait for it to finish, or press Review for a new one."
    RunDirTaken: "This run folder already holds another run's files, which a new review must not write over. Press Review to start the review in a new run folder."
    RunFolderFailed: "The run folder could not be written. Check the run root in Settings and the free space."
    RunInProgress: "A remodel is already running on this part. Wait for it to finish."
    RunNotFound: "That run is no longer tracked. Run it again."
    RunNotPlanned: "Plan the remodel first, then start it."
    RunRootChanged: "This run's folder is under a run root that is no longer in force, and runs go on only under the one in force. Start the run again."
    RunRootChosenNotInForce: "The folder for runs in force is refused, and the one chosen in Settings is not in force until the review backend restarts with it. Save the settings again to retry the restart."
    RunRootNotFullPath: "The folder for runs must be written as a full path, starting with its drive letter. Type the folder's full path in Settings."
    RunRootRefused: "Runs are made only in a local folder reached by its own path - not on a network share, not through a link, and with folder names Windows can use: none longer than 255 characters, none with \\ / : * ? \" < > | or a control character, none ending in a space or a period - and the add-in must be able to check that it is one. Choose a local folder for runs in Settings."
    ScopeNotAvailable: "That rule family is not offered here yet. Choose another scope."
    ScopeRefused: "The part changed or was not checked for this remodel. Plan it again."
    SelectionUnavailable: "Choose a saved target, or select one resolved component or face and try again."
    SessionFailed: "This review failed and cannot continue. Press Review to start a new one."
    TriageAlreadyRecorded: "That finding already has a triage, and a triage is recorded only once. The one recorded stands and is shown again."
    TurnRunning: "A review turn is still running. Wait for it to finish, or press Stop."
    Unauthorized: "The review backend did not recognise this pane. Close and reopen the task pane."
    UnknownChat: "This review is no longer held by the backend. Press Review to start a new one."
    UnknownCheck: "That check is no longer in the run root. Run the check again."
    UnknownEngineeringContextRun: "The saved context evidence is unavailable. Extract context evidence again."
    UnknownEvidenceRequest: "That question is not part of this review. Reload the review to see its questions."
