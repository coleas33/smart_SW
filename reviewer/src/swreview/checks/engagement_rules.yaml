# Minimum usable thread engagement, expressed as a multiple of the nominal thread
# diameter, by the material class of the tapped part. The rule that applied is cited in every
# finding so an engineer can override it per project.
#
# Which class a material name belongs to is material_classes.yaml's to say (feature 010
# research R2.16): one classifier serves engagement and the density checks, so the match
# tokens moved there on 2026-09-23 and this file keeps one ratio per class name. A class with
# no row here has no engagement rule, and the check stays unresolved for it; the default
# class (unknown) must carry none.
#
# Source notes:
#   steel        1.5 x d   owner decision 2026-09-23 (feature 010 research R2.14)
#   cast_iron    1.5 x d   common guidance for lower-shear-strength ferrous castings
#   aluminum     1.5 x d   owner decision 2026-09-23 (feature 010 research R2.14)
#   plastic      2.5 x d   common guidance for thermoplastics with metal inserts absent
#   unknown      (none)    no rule applied; the check stays unresolved
#
# The owner's answer was typed "1.td into both" (steel and aluminium). The only reading that
# is a ratio and matches the aluminium row this file already carried is 1.5 x d, and that is
# what both rows say; the spec's Assumptions and research R2.14 record the same reading, so a
# wrong one is visible in three places. Until 2026-09-23 steel was 1.0 x d (Machinery's
# Handbook, length of engagement for steel into steel).
version: 1
material_classes:
  steel:
    min_engagement_ratio: 1.5
    source: "Owner decision 2026-09-23: at least 1.5 x d into steel and aluminium alike"
  cast_iron:
    min_engagement_ratio: 1.5
    source: "Common guidance for ferrous castings"
  aluminum:
    min_engagement_ratio: 1.5
    source: "Owner decision 2026-09-23: at least 1.5 x d into steel and aluminium alike"
  plastic:
    min_engagement_ratio: 2.5
    source: "Common guidance for thermoplastics without inserts"
  unknown:
    min_engagement_ratio: null
    source: "No rule; material not recognized"
