# The coarse (standard) thread pitch of each size, as data (feature 010 amendment 2026-10-08,
# FR-029 to FR-034; contracts/fasteners.md section 8).
#
# `checks/coarse_pitch.py` reads this. Its classifier puts every thread designation in one
# class of contracts/fasteners.md section 8.1 for the thread pitch check: a thread finer than
# its size's coarse pitch, or of a size with no coarse pitch, is flagged for the engineer to
# confirm, and one coarser than it is flagged as non-standard (owner decision 50A). Its
# `coarse_pitch_mm` gives the fastener name grammar a metric size's coarse pitch (section 8.8).
#
# metric: ISO 261, the coarse pitch in millimetres of every nominal diameter to 68 mm that has
#   one (40 rows, ascending). ISO 965-1 omits the coarse pitch from a designation, so a metric
#   thread written with no pitch (M8) is the coarse one.
# metric_fine_only_mm: the ISO 261 diameters to 68 mm that have fine pitches only. Any other
#   metric diameter is in no table: an unknown size, listed, never judged.
# unified: ASME B1.1, the UNC threads per inch of every unified size from #1 to 2 in (25 rows,
#   ascending by diameter in inches; a number size #N is 0.060 + 0.013 N in). Compared as
#   threads per inch, never as millimetres.
# unified_fine_only: the unified sizes with no UNC thread (#0).
#
# Transcribed from the two standards on 2026-10-08 (feature 010 research R2.26), for the owner
# to check against the shop's copies before relying on them. This file is pinned key for key and
# value for value to specs/010-mechanical-checks/contracts/coarse-pitch.json
# (tests/unit/test_coarse_pitch.py), and the extractor's copy of the metric rows is pinned to it
# too (T115): a change to the table is one commit, the contract file and then both copies
# (section 8.3).
#
# The size labels are quoted: unquoted, YAML reads `#1` as a comment and `1` as a number.
version: 1
source: "Owner decision 2026-10-08 (50A): the shop uses coarse threads; fine pitch must be confirmed"
standards:
  metric: >-
    ISO 261, ISO general purpose metric screw threads, general plan: the coarse pitch of each
    nominal diameter to 68 mm, and the diameters to 68 mm that have fine pitches only; a pitch
    omitted from a designation is the coarse one (ISO 965-1)
  unified: >-
    ASME B1.1, unified inch screw threads: the UNC threads per inch of each size from #1 to 2
    in; #0 has no UNC thread
metric:
  - {size_mm: 1, coarse_pitch_mm: 0.25}
