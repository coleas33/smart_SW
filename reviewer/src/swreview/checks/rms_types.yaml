# The single normative RMS type table (specs/003-resilient-modeling/contracts/README.md).
#
# Provenance: type-name sets from LifeDay/Solidworks-Resilient-Modeling-Skill (commit
# df49e6d, rms_check.py), reused with the author's permission (NOTICE.md). Type names are
# GetTypeName2 strings. Calibrated by the source checker on SOLIDWORKS 2026 SP1.1; enum
# values below re-verified on the 2024 SP5 interop on 2026-09-15; runtime behavior is
# re-verified on the workstation with `swreview-extract probe rms` before any rule is
# trusted on a real part (research.md R5).
version: 1
calibrated_version: "2026 SP1.1"
groups: ["1-Ref", "2-Construction", "3-Core", "4-Detail", "5-Modify", "6-Quarantine"]
folder_type: FtrFolder
end_tag_suffix: "___EndTag___"
# Class sets are disjoint: every type name has at most one class. A rule that needs a union
# names the classes (rules.md "Class vocabulary").
classes:
  sketch: [ProfileFeature, 3DProfileFeature]
  solid: [Extrusion, Revolution, Sweep, Loft, Boss, Thicken, BaseFlange, Boundary, ImportedFeature]
  cut: [Cut, CutRevolve, SweepCut, LoftCut]
  hole: [HoleWzd, SimpleHole, Hole]
  fillet: [Fillet]
  chamfer: [Chamfer]
  shell: [Shell]
  draft: [Draft]
  pattern: [LPattern, CirPattern, MirrorPattern, MirrorSolid, CurvePattern, TablePattern, FillPattern, DerivedLPattern]
  reference: [RefPlane, RefAxis, CoordSys, RefPoint, OriginProfileFeature]
  construction: [SurfaceExtrude, SurfaceRevolve, SurfaceSweep, SurfaceLoft, SurfaceKnit, SurfaceTrim, SurfaceExtend, SurfacePlanar, SurfaceOffset, SurfaceRuled, SurfaceRadiate, SurfaceFill, CompositeCurve, "Reference Curve", ProjectionCurve, HelixCurve, SplitLine, SurfaceCut]
# Material of unknown kind. The source keeps ICE in both its cut and hole sets because its
# own recipe builds holes as cuts; on a real part an ICE boss would then read as a hole. Here
# ICE counts as material for the group-content rule and is unresolved for holes_last.
ambiguous: [ICE]
# The planner's target group per class (feature 004). The checker grades what a part is;
# this says what it should be, from the same file, so the two cannot drift. Values are group
# names from `groups` above, or `needs_judgement` where the table cannot decide and the
# planner must ask or report unresolved (constitution Principle I) - `needs_judgement` is not
# a seventh group. Two rules are code, not table, and are tested there: a *consumed* sketch
# follows its single consumer into that consumer's group (the value below is where an
# unconsumed sketch goes), and a fillet or chamfer with dependents can never be moved to
# 6-Quarantine (research R6.1).
default_group_by_class:
  sketch: 2-Construction
  solid: 3-Core
  cut: 4-Detail
  hole: 4-Detail
  fillet: 3-Core          # the safe default; a cosmetic fillet moves only by judgement (OQ-4)
  chamfer: 3-Core         # same reasoning; no judgement tool in v1
  shell: 3-Core           # rms.core.shell_last ranks it last inside Core
  draft: 5-Modify
  pattern: 5-Modify
  reference: 1-Ref
  construction: 2-Construction
  unknown: needs_judgement    # a type name nobody recognised is never guessed into a group
  ambiguous: needs_judgement  # ICE
# The base feature of a derived or mirrored part (feature 004, decision 17A, 2026-09-25). Its
# body is another part's geometry, brought in whole by this feature, so no feature of the part
# builds it: the re-modeler refuses such a part (`derived_part`) rather than reorganizing what is
# around its base. MirrorStock is a mirrored part's base feature and is on a real 2024 SP5 dump;
# Stock is Insert Part's, from the API's GetTypeName2 list, and is on no package yet - T137's
# census on the seat confirms or removes it. Neither may be tolerated or classified.
derived_base: [MirrorStock, Stock]
# Rows the method never groups, moves or describes: feature 003's checker and feature 004's
# planner read this one list. The last eleven are system rows from the census of three real
# ModelCheck dumps on 2024 SP5 (feature 004 T144/T145, decision 17A; the checker's too since the
# owner's decision 20A, 2026-09-25): the annotation folders and view under the annotations
# container (NotesAreaFtrFolder, AnnotationViewFeat), the scene's lights (AmbientLight,
# DirectionLight), a derived part's body and reference folders (FeatSolidBodyFolder to
# RefPointFtrFolder), and the cosmetic thread annotation (CosmeticThread). Only types seen on a
# real dump are listed; `calibrated_version` stays until the seat census (004 T137).
tolerated_loose: [OriginProfileFeature, MateGroup, HistoryFolder, SensorFolder, DetailCabinet, CommentFolder, FavoriteFolder, SolidBodyFolder, SurfaceBodyFolder, DocsFolder, MaterialFolder, EnvFolder, LightFolder, EqnFolder, RefPlane, OriginPoint, CoordSys, CommentsFolder, SelectionSetFolder, InkMarkupFolder, NotesAreaFtrFolder, AnnotationViewFeat, AmbientLight, DirectionLight, FeatSolidBodyFolder, FeatSurfaceBodyFolder, RefAxisFtrFolder, RefPlaneFtrFolder, ProfileFtrFolder, RefPointFtrFolder, CosmeticThread]
default_names_excluded: ["Front Plane", "Top Plane", "Right Plane", "Origin"]
# swConstrainedStatus_e (2024 SP5 and 2026 SP1.1 agree): 1 swUnknownConstraint,
# 2 swUnderConstrained, 3 swFullyConstrained, 4 swOverConstrained, 5 swNoSolution,
# 6 swInvalidSolution, 7 swAutosolveOff. Used for ISketch.GetConstrainedStatus and
# IComponent2.GetConstrainedStatus. Autosolve off means the sketch was never solved, so it is
# unknown, not an error. A raw value absent from this table maps to "unknown"; a null raw
# value is "unavailable".
constrained_status:
  1: unknown
  2: under_defined
  3: fully_defined
  4: over_defined
  5: solver_error
  6: solver_error
  7: unknown
assembly:
  # swSelectType_e names as MateDumper writes them (Enum.GetName); the dumper's fallback for
  # a value without a name is "unknown(<n>)". Kinds in neither list are unresolved for the
  # mate. swSelORIGINS does not exist on 2024; an Origin mate's kind is added after the probe.
  reference_entity_kinds: [swSelDATUMPLANES, swSelDATUMAXES, swSelDATUMPOINTS, swSelCOORDSYS]
  geometry_entity_kinds: [swSelFACES, swSelEDGES, swSelVERTICES]
  mate_chain_depth_limit: 3
