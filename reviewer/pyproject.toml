[project]
name = "swreview"
version = "0.1.0"
description = "SOLIDWORKS agentic design review pilot: IR models, deterministic checks, curated agent tools, report"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "anthropic>=0.80",
    "pydantic>=2.7",
    "pint>=0.24",
    "trimesh>=4.4",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
raycast = ["embreex"]

[project.scripts]
swreview = "swreview.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-regressions>=2.5",
    "ruff>=0.5",
    "jsonschema>=4.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swreview"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a saved native evidence package; skipped when absent",
    "raycast: needs the optional embreex wheel",
]
addopts = "-q"
