[project]
name = "swreview"
version = "0.2.0"
description = "SOLIDWORKS agentic design review pilot: IR models, deterministic checks, curated agent tools, report"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "openai>=2.0",
    "google-genai>=1.0",
    "mcp>=1.0",
    "starlette>=0.40",
    "sse-starlette>=2.1",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pint>=0.24",
    "trimesh>=4.4",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "typer>=0.12",
    "pyyaml>=6.0",
    "tiktoken>=0.9,<1",
]

[project.optional-dependencies]
raycast = ["embreex"]

[project.scripts]
swreview = "swreview.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-regressions>=2.5",
    "ruff>=0.5",
    "jsonschema>=4.22",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swreview"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a saved native evidence package; skipped when absent",
    "live: calls a real provider API; skipped without the provider's key in the environment",
    "raycast: needs the optional embreex wheel",
    "perf: asserts a wall-clock budget; collected only when `-m` names it (tests/conftest.py)",
]
addopts = "-q"
