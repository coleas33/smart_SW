# Fictional standards profile B. Every value is invented for the test suite and differs
# from profile A, from config/standards.example.yaml and from every value the macro
# carried (research.md R5), field by field. Its two-mate prefix "parts/hardware/dowels/"
# is LONGER than the one-mate prefix "parts/hardware/" it overlaps, so the reversed case
# of contracts/profile.md prefix semantics rule 6 is exercised rather than assumed.
version: 3

vault_root: "K:/kestrel-store"

library:
  skip_prefixes:
    - "stock/foams/"
    - "stock/cabling/"
    - "stock/bushings/"
  sketch_exempt_prefixes:
    - "stock/"
  one_mate_prefixes:
    - "parts/hardware/"
  two_mate_prefixes:
    - "parts/hardware/dowels/"
    - "parts/clips/"
    - "builds/shared/KS-7.SLDPRT"

data_card:
  properties:
    - "Kestrel Catalog Ref"
    - "Long Title"
    - "Surface Treatment"
    - "Blank Material"

part_number:
  pattern: "??#####-KS.SLD???"

revision:
  property: "KestrelRevision"
  initial: "-"
  header_text: "REVISIONS TABLE"
  cell:
    row_from_end: 2
    column: 0

material:
  configuration: "Machined"

export_control:
  phrase: "KESTREL-CONTROLLED"

general_tolerance:
  linear:
    - {decimal_places: 0, plus_minus_mm: 0.8}
    - {decimal_places: 1, plus_minus_mm: 0.35}
    - {decimal_places: 2, plus_minus_mm: 0.12}
  angular_deg: 1.25

hygiene:
  part_number_property: "Kestrel Part Code"
  description_property: "Kestrel Caption"

drawing:
  sheet_formats: []
  drafting_standard: ""
  projection: ""
  dimension_unit: ""
  drawing_template: ""
  bom_template: ""
