# Fictional standards profile A. Every value is invented for the test suite and differs
# from profile B, from config/standards.example.yaml and from every value the macro
# carried (research.md R5), field by field. Its one-mate prefix is LONGER than the
# two-mate prefix it overlaps, which is the ordinary case; profile B carries the
# reversed one (contracts/profile.md prefix semantics rule 6).
version: 4
# Version 4 (feature 013 T014): its part_roles section names every signal, and the
# sitting-shaped fixture (tests/fixtures/sitting) is classified against it.

vault_root: "/srv/meridian-vault"

library:
  skip_prefixes:
    - "catalog/gaskets/"
    - "catalog/looms/"
    - "catalog/rivets/"
  sketch_exempt_prefixes:
    - "catalog/"
  one_mate_prefixes:
    - "catalog/screws/hex/"
  two_mate_prefixes:
    - "catalog/screws/"
    - "catalog/spacers/"
    - "jobs/common/MR-4242.SLDPRT"

data_card:
  properties:
    - "Meridian Item Id"
    - "Short Note"
    - "Plating Spec"
    - "Raw Stock Code"

part_number:
  pattern: "MR-#####.SLD???"

revision:
  property: "MeridianRev"
  initial: "AA"
  header_text: "REV HISTORY"
  cell:
    row_from_end: 0
    column: 1

material:
  configuration: "Fabricated"

export_control:
  phrase: "MERIDIAN-EMBARGO"

general_tolerance:
  linear:
    - {decimal_places: 1, plus_minus_mm: 0.4}
    - {decimal_places: 2, plus_minus_mm: 0.15}
    - {decimal_places: 3, plus_minus_mm: 0.04}
  angular_deg: 0.6

hygiene:
  part_number_property: "Meridian Part Ref"
  description_property: "Meridian Summary"

drawing:
  sheet_formats:
    - "FICTIONAL-FORMAT-A"
  drafting_standard: "FICTIONAL-STANDARD"
  projection: "third_angle"
  dimension_unit: "mm"
  drawing_template: "meridian-sheet.drwdot"
  bom_template: "meridian-parts.sldbomtbt"

part_roles:
  bought_prefixes:
    - "catalog/purchased/"
  bought_folder_names:
    - "Meridian Supplied"
  switch:
    property: "Meridian Sourcing"
    bought_values:
      - "Procured"
    custom_values:
      - "Fabricated"
  vendor_properties:
    - "Meridian Supplier"
    - "Meridian Supplier Ref"
  distributor_block:
    properties:
      - "Meridian Dist Page"
      - "Meridian Dist Terms"
      - "Meridian Dist Text"
    min_valued: 3
  catalogue_numbers:
    shapes:
      - "MX###-##@"
    properties:
      - "Meridian Supplier Ref"
  custom_prefixes:
    - "MR-1"
    - "MR-2"
  bought_number_prefixes:
    - "MR-8"
    - "MR-9"
  detail_properties:
    - "Meridian Thread Note"
    - "Meridian Unit Cost"
