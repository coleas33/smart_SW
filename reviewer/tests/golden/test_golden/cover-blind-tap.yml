result:
  checklist:
  - bucket: open
    check_prefix: provenance.
    description: Confirm every reviewed document matches the manifest (vault version,
      revision, configuration, local modification). Surface every discrepancy at the
      top of the report before any other finding.
    id: provenance
    title: Provenance and manifest discrepancies
  - bucket: finding
    check_prefix: drawing.
    description: 'For each part drawing: material, general tolerance note, surface
      finish where functional, thread callouts with depth, critical fits with explicit
      tolerances. Missing text layers or unreadable sheets are unresolved, not passed.'
    id: drawing.manufacturing_inputs
    title: Drawing manufacturing inputs
  - bucket: open
    check_prefix: fit.
    description: Shaft/bore and pin/hole interfaces from mates and hole data; evaluate
      with check_fit using drawing limits. Missing limits stay unresolved.
    id: interfaces.fit
    title: Fits and clearances at mating interfaces
  - bucket: open
    check_prefix: stack.
    description: Stacks that set a functional gap or preload; evaluate with check_axial_stack.
    id: interfaces.stack
    title: Axial stacks and gaps
  - bucket: open
    check_prefix: fastener.
    description: 'For each screw or bolt: bottoming, usable thread engagement, thread
      match, head and washer clearance. Unknown usable thread depth stays unresolved
      with an evidence request.'
    id: fasteners
    title: Fastener joints
  - bucket: open
    check_prefix: hole.
    description: Coaxiality of hole pairs across mated parts using check_hole_alignment.
    id: holes.alignment
    title: Hole alignment across mating parts
  - bucket: open
    check_prefix: interference.
    description: Review grouped interferences and exceptions; truncated or failed
      pairs are unresolved. State the positions checked for mechanisms.
    id: interference
    title: Static interference
  - bucket: open
    check_prefix: rms.
    description: Part feature trees follow the six-group discipline with one-directional
      references, fully defined sketches and described features; the root assembly
      mates to reference geometry with a fixed or fully constrained first component
      and shallow chains; parts carry global variables. Run check_rms_part, check_rms_assembly
      and check_rms_equations. Drawing and judgement-only rules are recorded as out
      of scope with the reason.
    id: modeling.resilience
    title: Resilient Modeling Strategy
  - bucket: open
    check_prefix: coverage.
    description: Every gap in the package and every open evidence request is reflected
      in coverage.
    id: coverage.closeout
    title: Coverage close-out
