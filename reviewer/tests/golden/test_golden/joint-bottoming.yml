    inputs:
      clamped_0_cmp:0002:
        unit: mm
        value: 1.5
      clamped_0_cmp:0002_mm:
        unit: mm
        value: 1.5
      fastener_id: fst:1
      fastener_length:
        unit: mm
        value: 20.0
      fastener_length_mm:
