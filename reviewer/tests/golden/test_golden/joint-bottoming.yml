result:
- calculation:
    assumptions:
    - protrusion = screw length - clamped stack - washers
    - margin = usable thread depth - protrusion
    - the screw is drawn fully home and square to the joint face
    - lengths rounded to 1e-6 of the unit they are reported in
    excluded_effects:
    - thread form, class of fit, and the tolerance on the tapped depth
    - preload, thread shear area and stripping strength
    - chamfer, countersink and counterbore depth at the joint face
    - gasket compression and joint settling
    function: swreview.checks.fastener.check_fastener_joint
    function_version: '1'
    inputs:
      clamped_0_cmp:0002:
        unit: mm
        value: 1.5
      clamped_0_cmp:0002_mm:
        unit: mm
        value: 1.5
      fastener_id: fst:1
      fastener_length:
        unit: mm
        value: 20.0
      fastener_length_mm:
        unit: mm
        value: 20.0
      hole_id: hole:1
      usable_thread_depth:
        unit: mm
        value: 12.0
      usable_thread_depth_mm:
        unit: mm
        value: 12.0
    model: fastener.bottoming
    result:
      bottoms: true
      margin_mm: -6.5
      protrusion_mm: 18.5
    units_out: mm
  check: fastener.bottoming
  coverage_limits: []
  inputs:
  - unit: mm
    value: 20.0
  - unit: mm
    value: 12.0
  - unit: mm
    value: 1.5
  observed: 'fst:1 protrudes 18.5 mm into hole:1, which has 12.0 mm of usable thread:
    margin -6.5 mm'
  recommended_action: Shorten fst:1, deepen the tapped thread in hole:1, or add a
    washer, so the screw clamps the stack before it bottoms.
  requirement: 'the screw must clamp the stack before its tip reaches the bottom of
    the usable thread: usable thread depth - protrusion >= 0'
  severity: high
  status: demonstrated
- calculation:
    assumptions:
    - engagement = min(protrusion, usable thread depth)
    - 'engagement rule for material class aluminum: Owner decision 2026-09-23: at
      least 1.5 x d into steel and aluminium alike'
    - lengths rounded to 1e-6 of the unit they are reported in
    excluded_effects:
    - thread form, class of fit, and the tolerance on the tapped depth
    - preload, thread shear area and stripping strength
    - chamfer, countersink and counterbore depth at the joint face
    - gasket compression and joint settling
    function: swreview.checks.fastener.check_fastener_joint
    function_version: '1'
    inputs:
      clamped_0_cmp:0002:
        unit: mm
        value: 1.5
      clamped_0_cmp:0002_mm:
        unit: mm
        value: 1.5
      engagement_rule_source: 'Owner decision 2026-09-23: at least 1.5 x d into steel
        and aluminium alike'
      fastener_id: fst:1
      fastener_length:
        unit: mm
        value: 20.0
      fastener_length_mm:
        unit: mm
        value: 20.0
      hole_id: hole:1
      hole_material: 6061-T6
      material_class: aluminum
      nominal_diameter_mm:
        unit: mm
        value: 6.0
      usable_thread_depth:
        unit: mm
        value: 12.0
      usable_thread_depth_mm:
        unit: mm
        value: 12.0
    model: fastener.engagement
    result:
      engagement_mm: 12.0
      meets_rule: true
      protrusion_mm: 18.5
      ratio: 2.0
      required_ratio: 1.5
    units_out: mm
  check: fastener.engagement
  coverage_limits: []
  inputs:
  - unit: mm
    value: 20.0
  - unit: mm
    value: 12.0
  - unit: mm
    value: 1.5
  observed: 'fst:1 engages 12.0 mm of thread in hole:1: 2.0 x d against the 1.5 x
    d rule for aluminum'
  recommended_action: ''
  requirement: 'usable thread engagement must be at least 1.5 x the nominal thread
    diameter for material class aluminum (Owner decision 2026-09-23: at least 1.5
    x d into steel and aluminium alike)'
  severity: info
  status: checked_within_scope
- calculation:
